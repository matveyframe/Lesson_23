services:

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped

  app:
    image: python:3.12-alpine
    container_name: app-py
    working_dir: /app
    volumes:
        - ./:/app
    command: sh -c "pip install -r requirements.txt  && python app.py"
    ports:
        - "5000:5000"
    environment:
        REDIS_HOST: redis
    depends_on:
      - redis
    restart: unless-stopped


